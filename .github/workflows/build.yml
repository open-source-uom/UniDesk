name: Python CI/CD Pipeline (Linter + Debian Build)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-package:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # --- CODE QUALITY CHECKS ---
    - name: Install Ruff Linter
      run: pip install ruff

    - name: Run Ruff Static Analysis
      run: ruff check src/unidesk/

    - name: Scaffold Debian Control Files
      run: |
        mkdir -p debian

        cat << 'EOF' > debian/rules
        #!/usr/bin/make -f
        %:
        	dh $@ --with python3 --buildsystem=pybuild
        EOF
        chmod +x debian/rules

        cat << 'EOF' > debian/control
        Source: unidesk
        Section: python
        Priority: optional
        Maintainer: Apostolos Chalis <achalis@csd.auth.gr>
        Build-Depends: debhelper-compat (= 13), dh-python, python3-all, python3-setuptools
        Standards-Version: 4.6.2

        Package: python3-unidesk
        Architecture: all
        Depends: ${python3:Depends}, ${misc:Depends}, python3-pyqt6
        Description: Helper app for UniOS written in python/Qt
        EOF

        # This adds the vital changelog file that dpkg-buildpackage requires to run
        printf "unidesk (1.0.0-1) noble; urgency=low\n\n  * Initial release.\n\n -- Apostolos Chalis <achalis@csd.auth.gr>  Sun, 24 May 2026 19:42:00 +0200\n\n" > debian/changelog
