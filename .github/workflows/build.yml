name: Python CI/CD Pipeline (Linter + Debian Build)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-package:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # --- CODE QUALITY CHECKS ---
    - name: Install Ruff Linter
      run: pip install ruff

    - name: Run Ruff Static Analysis
      run: ruff check src/unidesk/

    # --- NATIVE DEBIAN PACKAGING (Zero stdeb dependence) ---
    - name: Install Native Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential debhelper dh-python python3-all python3-setuptools

    - name: Scaffold Debian Control Files
      run: |
        mkdir -p debian

        echo "13" > debian/compat

        cat << 'EOF' > debian/rules
        #!/usr/bin/make -f
        %:
        	dh $@ --with python3 --buildsystem=pybuild
        EOF
        chmod +x debian/rules

        cat << 'EOF' > debian/control
        Source: unidesk
        Section: python
        Priority: optional
        Maintainer: Ioannis Michadasis <michadasis@example.com>
        Build-Depends: debhelper-compat (= 13), dh-python, python3-all, python3-setuptools
        Standards-Version: 4.6.2

        Package: python3-unidesk
        Architecture: all
        Depends: ${python3:Depends}, ${misc:Depends}, python3-pyqt6
        Description: Helper app for UniOS written in python/Qt
        EOF

        cat << 'EOF' > debian/changelog
        unidesk (1.0.0-1) noble; urgency=low

          * Initial release.
        EOF

    - name: Build Debian Package
      run: |
        dpkg-buildpackage -us -uc -b

    - name: Upload Debian Package Artifact
      uses: actions/upload-artifact@v4
      with:
        name: unidesk-debian-package
        path: ../*.deb
