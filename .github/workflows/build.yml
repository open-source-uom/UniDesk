name: Python CI/CD Pipeline (Linter + Debian Build)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-package:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # --- CODE QUALITY CHECKS ---
    - name: Install Ruff Linter
      run: pip install ruff

    - name: Run Ruff Static Analysis
      run: ruff check src/unidesk/

    # --- DEBIAN PACKAGING (Runs if linter passes) ---
    - name: Install Packaging Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-all python3-setuptools python3-all-dev debhelper devscripts python3-stdeb

    - name: Build Debian Package via Native Scripts
      run: |
        # 1. Generate the debian source structure directory targeting Ubuntu Noble
        py2dsc --suite noble setup.py

        # 2. Move into the generated debian package source structure and compile the .deb
        cd deb_dist/unidesk-*
        dpkg-buildpackage -rfakeroot -uc -us -b

    - name: Upload Debian Package Artifact
      uses: actions/upload-artifact@v4
      with:
        name: unidesk-debian-package
        path: deb_dist/*.deb
